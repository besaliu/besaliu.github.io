<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin Liu - Resume</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0F;
            color: white;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00D4FF, #6B46C1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #00D4FF;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .download-btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00D4FF, #6B46C1);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BESALIU.dev</div>
        <div>
            <span class="loading"></span>
            Redirecting to resume...
        </div>
        <a href="/Ben's Resume.pdf" class="download-btn" download="Benjamin_Liu_Resume.pdf">
            Download Resume PDF
        </a>
    </div>
    
    <script>
        // Redirect to PDF after a short delay
        setTimeout(() => {
            window.location.href = "/Ben's Resume.pdf";
        }, 1500);
    </script>
</body>
</html>
